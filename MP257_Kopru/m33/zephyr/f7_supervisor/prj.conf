# Zephyr openamp_rsc_table örneğinin ayarları; kabuk (shell) kapalı çünkü o da "rpmsg-tty" kanalını ister.
CONFIG_KERNEL_BIN_NAME="F7Sup_Zephyr_CM33_NonSecure"
CONFIG_IPM=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n
CONFIG_SHELL=n

# LED (led0) ve USER2 butonu (sw0)
CONFIG_GPIO=y

# Zaman ölçümü 100 us çözünürlük (supervisor mikrosaniye ister)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Günlük UART5'e (M33 konsolu, ST-LINK'in ikinci COM portu)
CONFIG_LOG=y
CONFIG_PRINTK=y
