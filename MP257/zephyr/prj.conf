# M6: F746 ham telemetrisi, LD9, TELEM paketi ve Linux'a RPMsg kanalı.

# LD9 (PH6) bir GPIO pini
CONFIG_GPIO=y

# USART6 sürücüsü; baytlar kesmeyle gelir ve gider
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Yazı çıktısı yok
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# TELEM paketinin CRC8'i
CONFIG_CRC=y

# IPCC posta kutusu: Linux ile karşılıklı kesme
CONFIG_IPM=y

# RPMsg kütüphanesi; kanalı Linux yönetir
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n

# Linux kanalı bu tablodan öğrenir; yön başına 8 tampon (100 Hz'de 80 ms)
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8

# RPMsg kütüphanesinin açılışta ayırdığı bellek, bayt
CONFIG_HEAP_MEM_POOL_SIZE=2048
